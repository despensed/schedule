<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Расписание уроков">
    <meta name="author" content="Despenced">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ece6d8">
    <title>Расписание</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;800&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/status.css">
    <link rel="stylesheet" href="styles/schedule.css">
    <link rel="stylesheet" href="styles/settings.css">
    <link rel="stylesheet" href="styles/responsive.css">
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/settings-page.css">

    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">

    <script>
        (function () {
            var SETTINGS_KEY = 'app-settings';
            var THEME_KEY = 'theme';
            var THEME_EXPLICIT_KEY = 'theme-explicit';

            function isHex(v) { return typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v); }
            function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
            function hexToRgb(hex) {
                var c = hex.replace('#', '');
                if (c.length !== 6 || !/^[0-9a-f]{6}$/i.test(c)) return { r: 99, g: 102, b: 241 };
                return {
                    r: parseInt(c.substr(0, 2), 16),
                    g: parseInt(c.substr(2, 2), 16),
                    b: parseInt(c.substr(4, 2), 16)
                };
            }
            function pickTextColor(hex) {
                var x = hexToRgb(hex);
                return (0.2126 * x.r + 0.7152 * x.g + 0.0722 * x.b) > 160 ? '#0f172a' : '#ffffff';
            }

            var parsed = {};
            try { parsed = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}') || {}; } catch (e) {}

            var explicit = localStorage.getItem(THEME_EXPLICIT_KEY) === '1';
            var savedTheme = localStorage.getItem(THEME_KEY);
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

            var THEME_VALUES = ['light', 'dark'];
            var theme = (explicit && THEME_VALUES.indexOf(savedTheme) >= 0)
                ? savedTheme
                : (prefersDark ? 'dark' : 'light');

            var root = document.documentElement;
            var s = root.style;
            root.setAttribute('data-preset', (parsed.preset === 'graphite' || parsed.preset === 'terminal' || parsed.preset === 'glass' || parsed.preset === 'retro') ? parsed.preset : 'blank');

            root.setAttribute('data-theme', theme);

            // Нативные элементы (полосы прокрутки, дорожки ползунков,
            // диалог выбора цвета) берут схему из color-scheme,
            // поэтому синхронизируем её с темой приложения.
            var effective = root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
            s.colorScheme = effective;

            if (isHex(parsed.accentColor)) {
                s.setProperty('--accent-override', parsed.accentColor);
                s.setProperty('--accent-text-override', pickTextColor(parsed.accentColor));
            }
            if (isHex(parsed.lessonColor)) s.setProperty('--lesson-color-override', parsed.lessonColor);
            if (isHex(parsed.breakColor)) s.setProperty('--break-color-override', parsed.breakColor);
            if (isHex(parsed.heartOutlineColor)) s.setProperty('--heart-outline-override', parsed.heartOutlineColor);

            var glowRaw = parsed.glowIntensity;
            var glowNum = 0;
            if (glowRaw === 'off') glowNum = 0;
            else if (glowRaw === 'soft') glowNum = 8;
            else if (glowRaw === 'strong') glowNum = 16;
            else if (typeof glowRaw === 'number' && isFinite(glowRaw)) glowNum = glowRaw;
            glowNum = clamp(glowNum, 0, 20);
            if (glowNum > 0) {
                root.setAttribute('data-glow', 'on');
                s.setProperty('--glow-blur', glowNum + 'px');
            } else {
                root.setAttribute('data-glow', 'off');
            }

            var how = parsed.heartOutlineWidth;
            if (typeof how !== 'number' || !isFinite(how)) how = 1.5;
            s.setProperty('--heart-outline-width', clamp(how, 0, 4) + 'px');
        })();
    </script>
</head>
<body>
    <button id="menu-toggle" class="menu-toggle" type="button"
            aria-label="Настройки"
            aria-haspopup="dialog"
            aria-controls="settings-panel"
            aria-expanded="false">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
    </button>

    <div id="settings-overlay" class="settings-overlay" hidden></div>

    <aside id="settings-panel" class="settings-panel is-closed"
           role="dialog" aria-modal="true" aria-labelledby="settings-title" inert>
        <div class="settings-header">
            <h3 id="settings-title">Настройки</h3>
            <button id="settings-close" class="settings-close" type="button" aria-label="Назад">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="20" y1="12" x2="5" y2="12"></line>
                    <polyline points="11 5 4 12 11 19"></polyline>
                </svg>
            </button>
        </div>

        <div class="settings-body">
            <section class="settings-section" data-open="true">
                <button class="settings-section__header" type="button" aria-expanded="true">
                    <span>Тема</span>
                    <span class="settings-section__chevron" aria-hidden="true">›</span>
                </button>
                <div class="settings-section__body">
                    <div class="settings-section__inner">
                        <div class="setting-group">
                            <div class="segmented segmented-wrap" id="theme-switch" role="group" aria-label="Тема">
                                <button data-preset="blank" class="seg-btn" type="button">Бланк</button>
                                <button data-preset="graphite" class="seg-btn" type="button">Графит</button>
                                <button data-preset="terminal" class="seg-btn" type="button">Терминал</button>
                                <button data-preset="glass" class="seg-btn" type="button">Стекло</button>
                                <button data-preset="retro" class="seg-btn" type="button">Ретро</button>
                            </div>
                        </div>

                        <div class="setting-subgroup" id="variant-settings">
                            <div class="setting-group">
                                <div class="segmented" id="variant-switch" role="group" aria-label="Вариант темы"></div>
                            </div>
                        </div>

                    </div>
                </div>
            </section>

            <section class="settings-section" data-open="true">
                <button class="settings-section__header" type="button" aria-expanded="true">
                    <span>Таймер</span>
                    <span class="settings-section__chevron" aria-hidden="true">›</span>
                </button>
                <div class="settings-section__body">
                    <div class="settings-section__inner">
                        <div class="setting-group">
                            <div class="segmented segmented-wrap" id="style-switch" role="group" aria-label="Стиль таймера">
                                <button data-style="bar" class="seg-btn" type="button">Полоса</button>
                                <button data-style="ring" class="seg-btn" type="button">Кольцо</button>
                                <button data-style="clock" class="seg-btn" type="button">Часы</button>
                                <button data-style="hearts" class="seg-btn" type="button">Сердечки</button>
                                <button data-style="cells" class="seg-btn" type="button">Клетки</button>
                            </div>
                        </div>

                        <div class="setting-subgroup" id="heart-settings">
                            <div class="setting-group">
                                <label class="setting-label" for="heart-outline-color">Обводка сердец</label>
                                <div class="color-row">
                                    <input type="color" id="heart-outline-color" value="#6366f1">
                                    <span class="color-value" id="heart-outline-color-value">#6366f1</span>
                                    <button type="button" id="heart-outline-reset" class="mini-btn" title="Взять цвет урока">Авто</button>
                                </div>
                            </div>
                            <div class="setting-group">
                                <span class="setting-label">Анимация сердец</span>
                                <div class="segmented" id="heart-anim-switch" role="group" aria-label="Анимация сердец">
                                    <button data-heart-anim="none" class="seg-btn" type="button">Выкл.</button>
                                    <button data-heart-anim="bounce" class="seg-btn" type="button">Подпрыгивание</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

        </div>

        <div class="settings-footer">
            <button id="reset-settings" class="reset-btn" type="button">Сбросить настройки</button>
            <a href="https://github.com/despensed/schedule" target="_blank" rel="noopener noreferrer" class="github-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M12 2C6.48 2 2 6.58 2 12.25c0 4.53 2.87 8.37 6.84 9.73.5.09.68-.22.68-.49 0-.24-.01-.87-.01-1.7-2.78.62-3.37-1.37-3.37-1.37-.45-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.62.07-.62 1 .07 1.53 1.05 1.53 1.05.89 1.57 2.34 1.12 2.91.86.09-.66.35-1.12.63-1.38-2.22-.26-4.55-1.14-4.55-5.06 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.7 0 0 .84-.28 2.75 1.05A9.3 9.3 0 0 1 12 6.84c.85 0 1.7.12 2.5.35 1.91-1.33 2.75-1.05 2.75-1.05.55 1.4.2 2.44.1 2.7.64.72 1.03 1.63 1.03 2.75 0 3.93-2.33 4.8-4.56 5.05.36.32.68.95.68 1.91 0 1.38-.01 2.5-.01 2.84 0 .27.18.59.69.49A10.02 10.02 0 0 0 22 12.25C22 6.58 17.52 2 12 2z"/>
                </svg>
                <span>GitHub</span>
            </a>
        </div>
    </aside>

    <div id="confirm-overlay" class="confirm-overlay">
        <div class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
            <p id="confirm-title">Сбросить все настройки?</p>
            <div class="confirm-actions">
                <button id="confirm-cancel" class="mini-btn" type="button">Отмена</button>
                <button id="confirm-ok" class="mini-btn mini-btn--danger" type="button">Сбросить</button>
            </div>
        </div>
    </div>

    <header>
        <h1>
            <button type="button" id="header-title" title="К сегодняшнему дню">Расписание</button>
        </h1>
        <p id="today-date" class="today-date"></p>
        <nav aria-label="Дни недели">
            <ul>
                <li><a href="#monday" data-day="monday">Пн</a></li>
                <li><a href="#tuesday" data-day="tuesday">Вт</a></li>
                <li><a href="#wednesday" data-day="wednesday">Ср</a></li>
                <li><a href="#thursday" data-day="thursday">Чт</a></li>
                <li><a href="#friday" data-day="friday">Пт</a></li>
            </ul>
        </nav>
    </header>

    <div id="temp-badge" class="temp-badge" role="status" hidden></div>

    <main>
        <noscript>
            <section class="noscript-card">
                <h2 class="section-title">Сейчас</h2>
                <p class="status-text-only">Для просмотра расписания нужен JavaScript.</p>
            </section>
        </noscript>
        <section id="home">
            <h2 class="section-title">Сейчас</h2>
            <p class="status-text-only">Загрузка...</p>
        </section>
    </main>

    <script type="module" src="js/main.js"></script>
</body>
            </html>
